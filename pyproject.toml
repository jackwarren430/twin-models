[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-models"
version = "0.1.0"
description = "Self-play RLVR with two LoRA adapters over one frozen MLX base (Qwen3-8B)"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.30.0",
    "mlx-lm>=0.28.0",
    "numpy>=2.0",
    "sympy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# DGX Spark / CUDA native backend (compute.backend: torch). Kept optional so a
# Mac / mlx install pulls in none of it. On the Spark, install the sm_121 torch
# build FIRST from the nightly cu13 index (see DGX_SPARK.md) — the bare "torch"
# pin here is a fallback for hosts where the default wheel already supports the
# GPU. transformers/peft drive the model + LoRA; accelerate/safetensors support.
torch = [
    "torch>=2.5",
    "transformers>=4.44",
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that load the real MLX base model (slow, needs weights on disk)",
    "sprint1: Sprint 1 — foundation (config, base, adapters, schema)",
    "sprint2: Sprint 2 — scoring (tools, verifiers, rewards)",
    "sprint3: Sprint 3 — RL loop (grpo, roles, trainer) [planned]",
    "sprint4: Sprint 4 — scale & study [planned]",
    "sprint5: Sprint 5 — mini-01 audit fixes (gradient scaling, math certificates, seeding)",
    "sprint6: Sprint 6 — advantage-degeneracy fixes (G_c, mean-baseline advantages, interior target curve, zero-adv skip)",
    "sprint7: Sprint 7 — native tool calling, per-problem creator generation, personas, strict tool gate",
    "sprint8: Sprint 8 — audit-2026-07-03 fixes (think-scoped extraction, verify_math named-value symmetry, per-problem parse-fail scaling) + backlog",
]
