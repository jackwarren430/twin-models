# Default research / Sprint-4 scale config. Heavier than tiny.yaml; expect
# minutes per iteration. Thinking mode is ON here (DESIGN.md §12 Q4: off for v1
# to bring the loop up, back on at scale since better reasoning is the point) —
# the generation budgets below are sized to leave the <think> block room.
model:
  path: ~/.cache/lm-studio/models/mlx-community/Qwen3-8B-6bit
  enable_thinking: true
  max_kv_size: null

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0          # effective mlx-lm scale = alpha / rank = 2.0
  dropout: 0.0
  # keys omitted => all 7 linear projections (q,k,v,o,gate,up,down);
  # see twin.config.DEFAULT_LORA_KEYS. Set `keys: null` for mlx-lm auto-discovery.

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2
  top_p: 0.95
  # Budgets sized for thinking mode: the <think> block consumes tokens before
  # the creator's JSON / solver's ANSWER line, so these are larger than tiny.yaml.
  creator_max_tokens: 2048
  solver_max_tokens: 1536
  oracle_max_tokens: 1024

game:
  n_problems: 5         # N
  creator_group: 4      # G_c
  solver_attempts: 4    # K
  domains: ["math", "coding"]

rewards:
  w_gradient: 1.0
  w_consistency: 0.5
  w_oracle: 0.1
  w_valid: 0.1
  w_solve: 1.0
  w_oracle_solver: 0.05
  mse_beta: 4.0
  clip: 10.0

oracle:
  enabled: true
  cost_per_query: 1.0
  max_calls_per_turn: 4

tools:                  # creator inline CAS tool (ReAct); untaxed creator aid
  creator_tools: ["solve", "calc"]
  creator_max_tool_calls: 4
  creator_tool_rounds: 4
  cas_timeout_s: 3.0

roles:
  swap_interval: 100
  warmup_iterations: 50
  injection_rate: 0.0   # explicit cross-model LoRA blend; 0 = rotation-only (default)

train:
  iters: 1000
  learning_rate: 1.0e-5
  kl_beta: 0.02
  grad_accumulation_steps: 1
  seed: 0
  checkpoint_every: 100
  log_every: 1

paths:
  checkpoints: checkpoints
  runs: runs
