# 21-questions v9 — solver on a RE-MATCHED frontier bank (bank-v2).
#
# WHAT v8 SETTLED (final, 60 iterations, DESIGN §9.7-§9.11)
#
# The group-variance wall was real and a measured bank removes it:
# usable_group_rate 0.125 -> 0.823 mean, and within-secret win rate rose
# +0.204 +-0.066 end-to-end (first ten iterations vs last ten, 55 secrets in
# both). Instance memorisation ruled out by two exposure tests. The solver
# learns.
#
# Transfer is real but small. Replaying v8's checkpoints against a resolvable
# instrument under common random numbers gave B 0.3542 -> 0.4236, i.e. +0.069,
# about 34% of the training gain — suggestive but not significant (paired
# t=1.52, sign test p=0.053). On the pre-registered validation-v2 the criterion
# failed outright. Both instruments agree, because +0.069 sits just under
# validation-v2's pooled MDE of +0.0747.
#
# A static bank has a measurable shelf life. usable_group_rate fell 0.938 ->
# 0.713 across the run while training win rate rose, and building bank-v2
# showed only 34 of bank-v1's 61 secrets still on the frontier — 44% left it in
# one run. That is what v9 is for.
#
# TWO CHANGES, both deliberate.
#
#   1. bank_path: data/twentyq-bank-v2.json — the frontier RE-MATCHED to the
#      trained policy, calibrated by PLAYING adapter_B_step60 rather than the
#      base model. 138 secrets against bank-v1's 61, because hinted generation
#      (DESIGN §9.12) gave 3.7x more distinct candidates from the same budget.
#
#      CORRECTION, made at iteration 0 of the live run. The line above this
#      block originally claimed bank-v2 is "a frontier for the policy that will
#      actually train on it". That is FALSE as configured: v9's adapters are
#      zero-init, so it starts from the BASE policy, while bank-v2 was
#      calibrated by playing adapter_B_step60. Measured at iteration 0:
#
#          v8 iter 0 (base policy, base-calibrated bank-v1):  guess% 0.29, rgrad 0.86
#          v9 iter 0 (base policy, step60-calibrated bank-v2): guess% 0.12, rgrad 0.70
#
#      The run was NOT restarted, deliberately. Resuming from step60 would fix
#      the mismatch but contaminate the 27 bank-v1 secrets inside
#      validation-v5, cutting it to 55 and dropping the criterion's power to
#      t=2.10 against a 2.20 threshold — trading a powered criterion for a
#      tidier rationale, which is the exact mistake this project keeps making.
#
#      What v9 therefore tests is BETTER than the original design. v8 showed a
#      base-calibrated bank DECAYS as the solver improves (usable_group_rate
#      0.938 -> 0.713). A bank calibrated for a STRONGER policy starts hard and
#      becomes better matched as training proceeds — it drifts INTO the band
#      rather than out of it. So the question is now: does forward-calibration
#      solve the decay problem? Watch usable_group_rate rise or hold flat,
#      against v8's fall.
#
#      STOPPING CONDITION, fixed in advance: if usable_group_rate sits below
#      0.5 sustained over the first ten iterations, the bank is genuinely too
#      hard — rebuild it base-calibrated and restart. rgrad 0.70 at iteration 0
#      is healthy (v1..v7 ran at 0.125), so this is a guardrail, not a warning.
#
#   2. validation_secret_set: data/twentyq-validation-v5.json — an instrument
#      SIZED to the effect, fixed before the run starts. 82 secrets, every one
#      selected by playing the BASE policy and keeping only what it wins
#      sometimes and loses sometimes. Composed rather than generated because
#      generation is exhausted: validation-v4 drew 2400 rollouts and 88% of the
#      distinct novel candidates were 0/8 for the base model.
#
#      v5 is VALID FOR v9 AND NOT FOR v8. It includes the 27 bank-v1 secrets
#      absent from bank-v2, which v8 trained on and v9 never sees (v9's
#      adapters are zero-init, so it starts from base and trains only on
#      bank-v2). v8's numbers stay on validation-v2 and validation-v3.
#
# THE PRE-REGISTERED CRITERION, fixed here before the run.
#
# Primary: the slope of (B - A) on step, across the 13 validation checkpoints,
# is significantly positive at p<0.05. Secondary: B - A at step 60 exceeds
# zero. Not "B beat its step-0 value", because with common random numbers the
# frozen control is exactly constant and a trend across 13 paired checkpoints
# uses far more of the data than a two-point comparison.
#
# This criterion is POWERED, which none of v1..v8 were. At the paired
# per-secret sd of 0.2746 measured under CRN, and n=82:
#
#     per-checkpoint SE           0.0303
#     SE of total change over 60  0.0270
#     effect +0.050 -> t=1.85     (below threshold)
#     effect +0.069 -> t=2.56     (detectable; need ~2.20 at dof=11)
#     effect +0.100 -> t=3.71     (comfortably detectable)
#
# So a null here MEANS something, unlike v8's. Still run
#     .venv/bin/python scripts/validation_power.py \
#       tq-runs/q-v9-bank2-solver.jsonl --effect <v9's within-secret gain>
# before interpreting, because the sd is an estimate from one run and the
# realised value governs what the null is worth.
#
# Everything else is held at v8's values on purpose — N/K/T, lr, kl_beta,
# adv_mode, credit: terminal, question_retries: 4, w_repeat: 0.05, iters: 60.
# Two runs differing in one axis each are readable; two differing in six are
# not, which is what v5/v6/v7 did by moving reward design while gradient supply
# was the actual blocker.
#
# The frozen adapter A control stays, and under CRN it earns its keep twice
# over: it is the noise floor, and because it is deterministic it is also an
# integrity canary. In the v8 replay it scored EXACTLY 0.3542 at all seven
# checkpoints. Any deviation in v9 means something in the pipeline changed, and
# that is worth catching more than the ~8h it costs to keep measuring it.
#
# Expect bank-v2 to decay during v9 as bank-v1 did during v8. That is inherent
# to a static bank, not a defect of this run, and it is the measurement that
# motivates priority two.
#
# Runtime ~39h: ~22h training (60 iterations) plus ~17h validation (13 x 82
# secrets x 8 episodes x 2 adapters).
#
# PREREQUISITES — all satisfied 2026-07-28:
#   data/twentyq-bank-v2.json          138 secrets, calibrated vs step60
#   data/twentyq-validation-v5.json     82 secrets, base-calibrated
#   verified disjoint under edit-distance-1 matching
#
# Launch:
# scripts/run_twentyq_training.sh configs/twentyq-v9-bank2-solver.yaml \
#   UNIT=q-v9-bank2 RUN_NAME=q-v9-bank2-solver \
#   CKPT_DIR=checkpoints/twentyq-v9-bank2 \
#   EXTRA_HOLDOUT="data/twentyq-validation-v2.json data/twentyq-validation-v3.json"

compute:
  backend: torch
  device: cuda
  dtype: bfloat16
  attn_impl: sdpa
  tf32: true
  matmul_precision: high
  compile: false
  # Mandatory on the Spark: unified memory means a runaway GPU alloc takes the
  # whole box down, and the trunk activations are what overflow.
  grad_checkpointing: true

model:
  path: ~/.cache/huggingface/hub/models--google--gemma-4-E2B-it/snapshots/9dbdf8a839e4e9e0eb56ed80cc8886661d3817cf
  enable_thinking: false

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0
  dropout: 0.0

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2

twentyq:
  n_secrets: 8
  episodes_per_secret: 16
  max_turns: 21
  categories: ["animal", "food", "household object"]
  recent_secret_window: 128
  repeat_handling: retry
  repeat_gate_reward: 0.0

  # --- the bank (DESIGN §9) ---
  secret_source: bank
  bank_path: data/twentyq-bank-v2.json
  bank_balance_categories: true
  freeze_creator: true      # required by bank mode: creator authors nothing
  freeze_solver: false

  # --- turn waste ---
  question_retries: 4
  w_repeat: 0.05

  credit: terminal
  gamma: 1.0
  w_ensemble: 0.0

  w_guess: 1.0
  w_efficiency: 0.5
  w_close: 0
  w_format: 0.5
  # FAIL-CLOSED, reversing v7 — but INERT under secret_source: bank, where the
  # in-training gate is skipped entirely. That gate exists to police creator
  # output; bank secrets were authored offline and already vetted fail-closed
  # by Qwen3-8B with a terse-retry fallback, whereas the in-training judge is
  # the small base model with no fallback. Re-judging could only delete vetted
  # entries (an invalid verdict plays ZERO episodes), and v7 logged ~10%
  # unparseable verdicts. Kept set so a --secret-source creator override keeps
  # the strict posture rather than v7's fail_open, which passed 21/206
  # unparseable verdicts as VALID, clustered on exactly the corrupted non-words
  # that needed rejecting.
  secret_validity: fail_closed

  creator_thinking: false
  guesser_thinking: false
  answerer_thinking: false
  judge_thinking: false
  secret_max_tokens: 512
  question_max_tokens: 512
  answer_max_tokens: 512
  generation_batch_size: 16
  ensemble_batch_size: 4

  # Validation evaluates BOTH adapters, and under freeze_creator adapter A
  # never changes — which is the point, not waste. A is a frozen CONTROL arm
  # measured on the same secrets, the same instrument and the same schedule as
  # the solver. Pooled over the run that is 13 checkpoints x N_secrets x 8
  # episodes of a policy known not to move — an EMPIRICAL noise floor for the
  # metric the run is judged on, rather than a theoretical Wilson interval.
  # Given that reading trends out of noise is exactly how v6 and v7 went wrong,
  # and that in v8 the control's spread (0.042) turned out to exceed every
  # single B-A it was compared against, it is worth what it costs — which
  # scales with the set size: ~2.9h x (82 / 24) over the run.
  # B rising while A stays flat is the result; both drifting
  # together is an instrument artifact.
  validation_every: 5
  validation_secret_set: data/twentyq-validation-v5.json
  validation_episodes: 8
  # Common random numbers: every adapter at every checkpoint plays the SAME
  # sampled games. Not a third experimental change — it alters the variance of
  # the estimate, not its expectation. It is a better thermometer, and this
  # project's binding constraint has repeatedly turned out to be measurement
  # precision rather than the effect.
  #
  # v8 measured the cost of not having it: at step 0, where A and B hold
  # identical zero-init weights and are therefore the SAME policy, only 160 of
  # 192 episodes matched on turns and 178 of 192 on outcome. That noise sits
  # directly on B - A, and B - A is what the success criterion is stated in.
  validation_common_random_numbers: true
  validation_max_turns: 21
  reward_log: true

# Ignored under secret_source: bank (targets come from each entry's MEASURED
# rate, not a dictated curve). Kept so a --secret-source creator override
# reproduces the v7 band exactly.
rewards:
  target_hi: 0.9
  target_lo: 0.1

# No rotation: freezing is by ROLE, so a swap would hand the frozen role to the
# other adapter and both would end up training. Must stay 0.
roles:
  swap_interval: 0
  warmup_iterations: 0
  injection_rate: 0.0

train:
  iters: 60
  learning_rate: 1.0e-5
  kl_beta: 0.02
  adv_mode: mean
  grpo_microbatch: 1
  logit_chunk: 0
  checkpoint_every: 5
  log_every: 1

paths:
  checkpoints: checkpoints/twentyq
  runs: tq-runs
