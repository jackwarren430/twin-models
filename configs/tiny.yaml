# Tiny config: prove the loop end-to-end as fast as possible.
# Everything is shrunk so an iteration completes in a reasonable time on the M5.
model:
  path: ~/.cache/lm-studio/models/mlx-community/Qwen3-8B-6bit
  enable_thinking: false

lora:
  num_layers: 4        # only the last 4 blocks -> fast training
  rank: 64
  alpha: 128.0         # effective mlx-lm scale = alpha / rank = 2.0
  dropout: 0.0
  # keys omitted => all 7 linear projections (q,k,v,o,gate,up,down)

gen:
  creator_max_tokens: 768
  solver_max_tokens: 384
  oracle_max_tokens: 256

game:
  n_problems: 3        # N
  creator_group: 2     # G_c
  solver_attempts: 2   # K
  domains: ["math"]

tools:                 # creator inline CAS tool (ReAct); small budgets for speed
  creator_tools: ["solve", "calc"]
  creator_max_tool_calls: 2
  creator_tool_rounds: 2

roles:
  swap_interval: 20
  warmup_iterations: 0
  injection_rate: 0.0

train:
  iters: 20
  learning_rate: 1.0e-5
  kl_beta: 0.02
  checkpoint_every: 10
  log_every: 1
