# 21-questions shakeout on the DGX SPARK (torch/CUDA, GB10, 128GB unified) with
# the ENSEMBLE dense reward. gemma-4-E2B is both the policy AND (via the roster
# in ensemble_reward.py) one of the frozen scorers. See twentyq-ensemble-reward.
#
# Launch under a cgroup cap so a runaway OOM kills only this run (unified memory
# is shared CPU+GPU — see dgx-spark-unified-memory-oom):
#   systemd-run --user -p MemoryMax=100G -p MemorySwapMax=0 \
#     --setenv=PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#     --working-directory=$PWD \
#     bash -c '.venv/bin/python -u scripts/train_twentyq.py --config configs/twentyq-tiny.yaml'

compute:
  backend: torch              # <-- the DGX Spark switch (default is mlx / Apple silicon)
  device: cuda
  dtype: bfloat16             # Blackwell-native; full-precision base + bf16 LoRA
  attn_impl: sdpa             # torch fused attention; "flash_attention_2" if the wheel is built
  tf32: true                  # TF32 matmul/cuDNN — set once here, applies to the ensemble too
  matmul_precision: high
  compile: false              # torch.compile the scoring forward (may recompile on adapter swap)
  grad_checkpointing: false   # twentyq completions are short (<=256 tok) -> backward is tiny; ON only if you OOM

model:
  # HF checkpoint snapshot (proven-loading dir; a bare repo id "google/gemma-4-E2B-it"
  # also resolves from the cache). The torch backend loads it bf16 via transformers;
  # gemma's <end_of_turn> stop token is read from generation_config automatically,
  # so the mlx-only load_strict / eos_token_ids knobs are NOT needed here.
  path: ~/.cache/huggingface/hub/models--google--gemma-4-E2B-it/snapshots/9dbdf8a839e4e9e0eb56ed80cc8886661d3817cf
  enable_thinking: false      # gemma4 reasons by default; ON = truncation trap (all per-role knobs OFF below)

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0
  dropout: 0.0

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2            # judge AND answerer sampling

twentyq:
  n_secrets: 5               # N (shakeout; q-01 uses 3)
  episodes_per_secret: 8     # K (shakeout; q-01 uses 4)
  max_turns: 21               # T (shakeout; q-01 uses 10)
  categories: ["animal", "food", "household object"]

  # ----- ENSEMBLE dense reward (this pipeline's point) -----
  # Per turn: r_t = w_ensemble * (gamma * score(history_t) - score(history_{t-1})),
  # with score(history_0) the empty-history baseline, PLUS the sparse terminal
  # reward on the last turn. The frozen ensemble replaces the per-turn judge Φ.
  credit: ensemble
  gamma: 1.0
  w_ensemble: 0.3
  ensemble_models: []        # [] = all 4 in ENSEMBLE_MODELS. Subset e.g.
                             # ["gemma-4-e2b", "qwen3-4b"] trims resident memory.
  ensemble_device: cuda
  ensemble_dtype: bfloat16

  w_guess: 1.0
  w_efficiency: 0.5
  w_close: 0               # unused under credit: ensemble (no judge Φ call)
  w_format: 0.5
  # gemma4-E2B's audit false-flags truthful answers; void only on a MAJORITY of
  # flagged lies so one bad F doesn't sink a good episode (q-gemma-shakeout-02).
  audit_void_fraction: 0.5

  # All roles + judge thinking OFF: gemma4-E2B reasons by default and truncates
  # before the contract line at any sane budget (q-shakeout-01/02/03).
  creator_thinking: false
  guesser_thinking: false
  answerer_thinking: false
  judge_thinking: false
  secret_max_tokens: 512     # no thinking: one JSON object
  question_max_tokens: 512   # no thinking: one QUESTION/GUESS line
  answer_max_tokens: 512      # no thinking: one ANSWER line

rewards:
  target_hi: 0.9             # interior band keeps episode outcomes stochastic
  target_lo: 0.1

roles:
  swap_interval: 5          # 0 = the no-rotation control arm
  warmup_iterations: 0
  injection_rate: 0.0

train:
  iters: 30
  learning_rate: 1.0e-5
  kl_beta: 0.02
  adv_mode: mean
  # Memory: score ONE trajectory per backward chunk (grads accumulate — identical
  # math, peak bounded to one traj). Without this the whole GRPO batch (up to
  # ~840 turn-trajectories at N5*K8*T21) builds in ONE graph and OOMs even on the
  # Spark's 128GB. logit_chunk stays 0: gemma4 doesn't expose the chunked LM-head
  # path, and short (non-thinking) completions don't need it. See twentyq-gemma-q8.
  grpo_microbatch: 1
  logit_chunk: 0
  checkpoint_every: 5
  log_every: 1

paths:
  checkpoints: checkpoints/twentyq   # keep clear of the self-play step files
  runs: tq-runs
