# Fourth real run — "mini-04": the Sprint-7 config. Attacks mini-03b's measured
# failure (creator made ZERO real tool calls — it simulated the CAS inside
# <think> and guessed the results) plus mini-02's solver-signal starvation.
#
# Deltas vs mini3.yaml (all Sprint 7; DESIGN.md §11):
#   - tools.protocol: native      Qwen3 function calling (<tool_call> JSON via
#                                 the chat template) instead of the legacy
#                                 <tool>...</tool> text protocol the model was
#                                 never trained on. Watch creator_tool_ok and
#                                 creator_answer_in_obs in the JSONL.
#   - game.creator_mode: per_problem
#                                 N separate creator rollouts (one problem
#                                 each): full thinking budget per problem,
#                                 shorter trajectories in the GRPO backward,
#                                 suite reward broadcast to all N (per-problem
#                                 credit split is a Sprint-8 ablation).
#   - game.condition_on_previous: true
#                                 problem k sees the JSONs (never the thinking)
#                                 of problems 1..k-1 + its rank's dictated
#                                 difficulty and target solve rate.
#   - game.personas: true         A="alpha", B="omega", fair-competition
#                                 framing; creator is told the calibration win
#                                 condition ("predict exactly what omega can
#                                 and cannot solve"), hardest rank asks for a
#                                 problem the opponent almost never cracks.
#   - game.require_tool_use: false
#                                 strict tool gate OFF for mini-04 (log-first:
#                                 flip on if answer_in_obs shows the creator
#                                 still fakes tool results under native).
#   - game.n_problems: 5          N 3->5: room for the gradient to be a real
#                                 ramp (targets 0.9/0.7/0.5/0.3/0.1).
#   - game.solver_attempts: 8     K 4->8: halves solve-rate quantization
#                                 (eighths, not quarters) — attacks the 88%
#                                 saturated K-groups mini-02 measured.
#   - rewards.w_brevity: 0.25     0.15->0.25, still << w_solve: stronger
#                                 tie-break among solved attempts + thinking
#                                 compression. Watch solve rate for drops.
#   - solver_temp stays 0.8       (decision 2026-07-03: variance comes from
#                                 harder problems + brevity, not hotter
#                                 sampling — hotter would redefine the solve-
#                                 rate measurement the creator is graded on).
#
# COST: max solver generations/iter = G_c*N*K = 4*5*8 = 160 (mini-03: 48).
# Budget wall-clock accordingly (batched solver generation is Sprint 8).
# Launch: conda run --no-capture-output -n twin-models python -u ... (plain
# conda run buffers stdout); caffeinate -i; transcript ON (do NOT pass
# --no-transcript).
model:
  path: ~/.cache/lm-studio/models/mlx-community/Qwen3-8B-6bit
  enable_thinking: true
  max_kv_size: null

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0          # effective mlx-lm scale = alpha / rank = 2.0
  dropout: 0.0

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2
  top_p: 0.95
  # 4096 everywhere (probe_memory: 8192 worst-cases a 132GB backward). In
  # per-problem mode each of the N rollouts gets this budget to itself.
  creator_max_tokens: 4096
  solver_max_tokens: 4096
  oracle_max_tokens: 4096

game:
  n_problems: 5         # N (see header)
  creator_group: 4      # G_c (unchanged)
  solver_attempts: 8    # K (see header)
  domains: ["math"]     # coding stays dropped until its pipeline sprint
  creator_mode: per_problem
  condition_on_previous: true
  personas: true
  require_tool_use: false

rewards:
  w_gradient: 1.0
  w_consistency: 0.5
  w_oracle: 0.1
  w_valid: 0.1
  w_solve: 1.0
  w_oracle_solver: 0.05
  w_brevity: 0.25       # see header; 0.15 in mini-03
  mse_beta: 4.0
  clip: 10.0
  target_hi: 0.9        # interior target ramp (kept) -> per-rank targets
  target_lo: 0.1        # [0.9, 0.7, 0.5, 0.3, 0.1] at N=5

oracle:
  enabled: true
  cost_per_query: 1.0
  max_calls_per_turn: 4

tools:
  creator_tools: ["solve", "calc"]
  creator_max_tool_calls: 4   # per rollout = per problem in per_problem mode
  creator_tool_rounds: 4
  cas_timeout_s: 3.0
  protocol: native      # Sprint 7 (see header); judge stays on legacy ReAct

roles:
  swap_interval: 8
  warmup_iterations: 5
  injection_rate: 0.0   # rotation-only (the headline mechanism)

train:
  iters: 30
  learning_rate: 1.0e-5
  kl_beta: 0.02
  grad_accumulation_steps: 1
  grpo_microbatch: 1    # one 4096-token rollout per backward chunk
  adv_mode: mean        # Dr.GRPO mean baseline
  seed: 0
  checkpoint_every: 5
  log_every: 1

paths:
  checkpoints: checkpoints
  runs: runs
