# "mini-05" — bounded-deliberation creator (2026-07-04). Direct response to
# mini-04b's resolution (EXPERIMENTS.md): the calibration reward alone CANNOT
# ratchet difficulty in a non-thinking creator. GRPO only reinforces what
# sampling discovers; with deliberation removed, sampled problem diversity
# collapsed to one trivial template (coefficient-swapped quadratics, prompt-
# example parroting), solve rates pinned at 1.0, r_gradient pinned at the
# all-solved floor (~0.267) for all 15 iterations, and rotation TRANSPORTED
# the collapse (B converged to A's safe strategy in one update). The two
# measured failure modes now bracket the design space:
#   mini-04(a) thinking ON, uncapped: simulate-don't-call + hard-rank spirals
#              burning full 4096 budgets (0/40 real tool calls, old prompt).
#   mini-04(b) thinking OFF:          100% tool adoption, clean machinery,
#              ~30-35 min/iter — but template collapse, zero exploration.
# mini-05 = the interior point: deliberation RESTORED but BOUNDED, plus the
# two anti-collapse mechanisms Sprint 9 built but no run has used yet.
#
# Deltas vs mini4b.yaml:
#   - model.creator_enable_thinking: true
#                                 exploration needs deliberation space; the
#                                 two-phase VERIFY/DELIVER prompt (which
#                                 mini-04b validated at 100% adoption) stays.
#   - gen.creator_max_tokens: 2048
#                                 the hard cap. Probe 1 measured hard-rank
#                                 spirals burning the FULL 4096 without
#                                 finishing — more room does not fix spirals,
#                                 so the cap is damage control: a spiral costs
#                                 a bounded 2048 tokens and lands as a parse-
#                                 fail (own-rank penalty, no re-stretch
#                                 exploit post-audit-fix), while legitimate
#                                 verify+deliver keeps ~9x the ~215-token
#                                 no-think rollout length.
#   - rewards.w_diversity: 0.3    first run with the penalty ON, now that the
#                                 similarity metric is digit-normalized (a
#                                 coefficient-swapped template reads ~1.0, not
#                                 0.3-0.7). Cross-suite nearest-neighbour;
#                                 GRPO feels only the suite-vs-suite contrast.
#   - game.theme_weights: data/themes-grounded.json
#                                 first run with grounded themes: weights the
#                                 theme draw toward the base model's measured
#                                 failure profile (number theory, intermediate
#                                 algebra lead) instead of uniform.
#   - prompts (no config)         cert-format example equations are now
#                                 explicitly banned from reuse as problems
#                                 (mini-04b: both adapters submitted
#                                 "x + y = 10, x - y = 2" verbatim).
# Unchanged and load-bearing: require_tool_use TRUE (gate validated: 100%
# adoption, 1/300 gated), solver_batch 8, N=5 K=8 G_c=4, targets 0.9->0.1,
# w_brevity 0.25, native protocol, rotation warmup 5 / swap 8, seed 0.
# NOT bundled (one memory-risk change at a time): train.logit_chunk stays 0 —
# 04(a) survived 4096-token thinking-creator backwards without it, and it is
# not yet probe_memory-certified.
# WATCH: (1) hard-rank spiral rate under the cap (n_parse_failed by rank);
# (2) does w_diversity + thinking break the template equilibrium —
# per-suite repetition on the NEW metric vs solve_rate_mean; (3) r_gradient
# lifting off the 0.267 all-solved floor is THE success signal; (4) wall
# clock (expect slower than 04b's ~32 min/iter; cap bounds the worst case).
model:
  path: ~/.cache/lm-studio/models/mlx-community/Qwen3-8B-6bit
  enable_thinking: true
  creator_enable_thinking: true   # mini-05: bounded deliberation (see header)
  max_kv_size: null

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0          # effective mlx-lm scale = alpha / rank = 2.0
  dropout: 0.0

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2
  top_p: 0.95
  creator_max_tokens: 2048  # HARD CAP on deliberation (see header)
  solver_max_tokens: 4096
  oracle_max_tokens: 4096
  solver_batch: 8       # validated in mini-04b (~30-35 min/iter)

game:
  n_problems: 5         # N
  creator_group: 4      # G_c
  solver_attempts: 8    # K
  domains: ["math"]     # coding stays out until its shakeout passes
  creator_mode: per_problem
  condition_on_previous: true
  personas: true
  require_tool_use: true    # validated: selects, does not starve
  theme_weights: data/themes-grounded.json  # mini-05: grounded draw (header)

rewards:
  w_gradient: 1.0
  w_consistency: 0.5
  w_oracle: 0.1
  w_valid: 0.1
  w_solve: 1.0
  w_oracle_solver: 0.05
  w_brevity: 0.25
  w_diversity: 0.3      # mini-05: anti-template pressure (see header)
  mse_beta: 4.0
  clip: 10.0
  target_hi: 0.9
  target_lo: 0.1

oracle:
  enabled: true
  cost_per_query: 1.0
  max_calls_per_turn: 4

tools:
  creator_tools: ["solve", "calc"]
  creator_max_tool_calls: 4
  creator_tool_rounds: 5
  cas_timeout_s: 3.0
  protocol: native

roles:
  swap_interval: 8
  warmup_iterations: 5
  injection_rate: 0.0   # rotation-only

train:
  iters: 30
  learning_rate: 1.0e-5
  kl_beta: 0.02
  grad_accumulation_steps: 1
  grpo_microbatch: 1
  adv_mode: mean        # Dr.GRPO mean baseline
  seed: 0
  checkpoint_every: 5
  log_every: 1

paths:
  checkpoints: checkpoints
  runs: runs
