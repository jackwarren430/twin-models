# Second real run — "mini-02": mini-01 + the Sprint-6 advantage-degeneracy
# fixes (DESIGN.md §11 Sprint 6; EXPERIMENTS.md mini-01 audit). mini-01 proved
# the loop learns but wasted ~60% of solver rollout compute on zero-gradient
# iterations: G_c=2 tied constantly (creator pg==0 in 15/30 iters), ÷std
# advantages turned solve-rate noise into full-strength ±1 signals, and the
# 1→0 target ramp made the endpoint ranks' solver groups zero-variance by
# design. This run is the measured ablation against mini-01 for all of that.
#
# Deltas vs mini.yaml (mini-01):
#   - creator_group (G_c) 2->4      cuts all-tie probability sharply and gives
#                                   4-point creator groups real gradation.
#                                   COST: +2 creator ReAct generations/iter
#                                   (~5-9 min) — but note the solver term also
#                                   scales with consistent problems across ALL
#                                   4 suites, so consistency-heavy math iters
#                                   can approach 2x mini-01 late-run times.
#   - rewards.target_hi/lo 1,0 -> 0.9,0.1   interior target ramp: every rank
#                                   keeps outcome variance, so solver K-groups
#                                   stay informative at creator-optimum. This
#                                   CHANGES THE GAME'S INCENTIVES — that's why
#                                   this run is an ablation, not a silent swap.
#   - train.adv_mode: mean          Dr.GRPO-style A = R − mean(R) (new code
#                                   default, pinned here for the record):
#                                   near-tie groups get near-zero gradients
#                                   instead of ±1; real gaps stay strong.
#   - (code, no knob) zero-advantage batches now skip the whole GRPO update
#     (reference pass + backward), logged as skipped_zero_adv — saturated
#     iterations stop paying minutes for a ≈0 pure-KL gradient.
# Everything else identical to mini.yaml.
model:
  path: ~/.cache/lm-studio/models/mlx-community/Qwen3-8B-6bit
  enable_thinking: true
  max_kv_size: null

lora:
  num_layers: 16
  rank: 64
  alpha: 128.0          # effective mlx-lm scale = alpha / rank = 2.0
  dropout: 0.0

gen:
  creator_temp: 0.9
  solver_temp: 0.8
  oracle_temp: 0.2
  top_p: 0.95
  # 4096 everywhere: measured in mini-01 shakeout — 2048 truncated the creator
  # mid-<think> (parse_ok=0.5); 4096 leaves headroom for longer CoT.
  creator_max_tokens: 4096
  solver_max_tokens: 4096
  oracle_max_tokens: 4096

game:
  n_problems: 3         # N  (3-point difficulty curve = enough to fit a slope)
  creator_group: 4      # G_c  (mini-01 ran 2; see header)
  solver_attempts: 4    # K  (GRPO group per problem)
  domains: ["math", "coding"]

rewards:
  w_gradient: 1.0
  w_consistency: 0.5
  w_oracle: 0.1
  w_valid: 0.1
  w_solve: 1.0
  w_oracle_solver: 0.05
  mse_beta: 4.0
  clip: 10.0
  target_hi: 0.9        # interior target ramp (mini-01 ran 1.0 -> 0.0)
  target_lo: 0.1

oracle:
  enabled: true
  cost_per_query: 1.0
  max_calls_per_turn: 4

tools:                  # creator inline CAS tool (ReAct); untaxed creator aid
  creator_tools: ["solve", "calc"]
  creator_max_tool_calls: 4
  creator_tool_rounds: 4
  cas_timeout_s: 3.0

roles:
  swap_interval: 8
  warmup_iterations: 5
  injection_rate: 0.0   # rotation-only (the headline mechanism)

train:
  iters: 30
  learning_rate: 1.0e-5
  kl_beta: 0.02
  grad_accumulation_steps: 1
  grpo_microbatch: 1    # one 4096-token rollout per backward chunk (mini-01
                        # run0 OOMed the 32GB box without this)
  adv_mode: mean        # Dr.GRPO mean baseline (see header); "std" = legacy
  seed: 0
  checkpoint_every: 5
  log_every: 1

paths:
  checkpoints: checkpoints
  runs: runs
